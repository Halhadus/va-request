name: Feature request
description: Propose a codec, format, operation or tooling improvement.
title: "[Feature] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the operation and the application that needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Relevant interface or device evidence
      description: Link public UAPI documentation, controls/formats, capability inventory or related hardware reports when applicable.
