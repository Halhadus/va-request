name: Hardware report
description: Submit capability and test results for a device.
title: "[Hardware] "
labels: [hardware-report, needs-triage]
body:
  - type: input
    id: device
    attributes:
      label: Device and SoC
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Kernel and userspace
      description: Distribution, architecture, kernel release, kernel source/branch, custom patches, V4L2 drivers and DRM driver.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Driver source revision
      description: Commit or package version, including local changes.
    validations:
      required: true
  - type: textarea
    id: inventory
    attributes:
      label: Capability inventory
      description: Attach the JSON file generated by tools/collect_capabilities.py. Include any collection errors.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Test report
      description: Attach the REPORT archive from tools/test.py. Include the command and render node. If tests could not run, describe why.
    validations:
      required: true
  - type: textarea
    id: operations
    attributes:
      label: Observed operation
      description: List the operations and applications tested, including codec profiles, formats and dimensions. Describe failures and untested paths. Include the decoder backend if known.
    validations:
      required: true
